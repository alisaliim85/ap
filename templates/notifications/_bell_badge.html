<div id="notification-badge"
     hx-get="{% url 'notifications:unread-count' %}"
     hx-trigger="every 30s [!document.hidden]"
     hx-swap="outerHTML"
     hx-target="#notification-badge"
     hx-vals='js:{ since: (window._lastNotifCheck || 0) }'>
  <a href="{% url 'notifications:list' %}"
     class="relative flex items-center p-2 text-slate-500 hover:text-brand-600 transition rounded-full hover:bg-slate-100">
    <i class="ph-duotone {% if unread_count > 0 %}ph-bell-ringing text-brand-600{% else %}ph-bell{% endif %} text-2xl"></i>
    {% if unread_count > 0 %}
    <span class="absolute top-0.5 end-0.5 h-5 w-5 bg-red-500 text-white text-[10px] font-bold flex items-center justify-center border-2 border-white rounded-full leading-none">
      {% if unread_count > 99 %}99+{% else %}{{ unread_count }}{% endif %}
    </span>
    {% endif %}
  </a>
  {% if toast %}
  <div id="toast-container" hx-swap-oob="innerHTML">
    {% include 'notifications/_toast.html' with toast_title=toast.title toast_body=toast.body %}
  </div>
  {% endif %}
  <script>window._lastNotifCheck = Math.floor(Date.now() / 1000);</script>
</div>
