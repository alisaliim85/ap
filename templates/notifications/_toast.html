<div x-data="{ show: true }"
     x-init="setTimeout(() => show = false, 5000)"
     x-show="show"
     x-cloak
     x-transition:enter="transition ease-out duration-300"
     x-transition:enter-start="opacity-0 scale-95"
     x-transition:enter-end="opacity-100 scale-100"
     x-transition:leave="transition ease-in duration-200"
     x-transition:leave-start="opacity-100 scale-100"
     x-transition:leave-end="opacity-0 scale-95"
     class="flex items-start gap-3 bg-white border border-brand-200 shadow-lg rounded-xl px-4 py-3 min-w-0 max-w-xs">
  <div class="flex-shrink-0 mt-0.5 h-8 w-8 rounded-full bg-brand-100 flex items-center justify-center text-brand-600">
    <i class="ph-duotone ph-bell-ringing text-sm"></i>
  </div>
  <div class="flex-1 min-w-0">
    <p class="text-sm font-bold text-slate-800 leading-snug">{{ toast_title }}</p>
    {% if toast_body %}
    <p class="mt-0.5 text-xs text-slate-500 line-clamp-2">{{ toast_body|truncatechars:100 }}</p>
    {% endif %}
  </div>
  <button @click="show = false"
          class="flex-shrink-0 text-slate-400 hover:text-slate-600 transition p-0.5">
    <i class="ph-bold ph-x text-xs"></i>
  </button>
</div>
