<option value="">---------</option>
{% for pc in policy_classes %}
<option value="{{ pc.id }}">{{ pc.name }}</option>
{% endfor %}

<select id="id_sponsor_number" name="sponsor_number" hx-swap-oob="true" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-brand-500 focus:border-brand-500">
    <option value="">---------</option>
    {% for sn in sponsor_numbers %}
    <option value="{{ sn.id }}">{{ sn.sponsor_number }} - {{ sn.owner_client.name_en }}</option>
    {% endfor %}
</select>

<select id="id_sponsor" name="sponsor" hx-swap-oob="true" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-brand-500 focus:border-brand-500">
    <option value="">---------</option>
    {% for sponsor in sponsors %}
    <option value="{{ sponsor.id }}">{{ sponsor.full_name }}</option>
    {% endfor %}
</select>
