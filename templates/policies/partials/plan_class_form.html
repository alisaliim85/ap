<div class="bg-white rounded-xl shadow-sm border border-brand-200 p-5 mb-4">
    <h3 class="font-bold text-slate-700 mb-4 flex items-center gap-2">
        <i class="ph-duotone ph-plus-circle text-brand-600 text-xl"></i>
        إضافة فئة جديدة لـ "{{ plan.name }}"
    </h3>
    <form method="post" action="{% url 'policies:plan_class_create' plan_pk=plan.pk %}"
          hx-post="{% url 'policies:plan_class_create' plan_pk=plan.pk %}"
          hx-target="#plan-classes-container"
          hx-swap="innerHTML"
          novalidate>
        {% csrf_token %}
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">اسم الفئة <span class="text-red-500">*</span></label>
                {{ form.name }}
                {% if form.name.errors %}
                    <p class="text-red-500 text-xs mt-1">{{ form.name.errors.0 }}</p>
                {% endif %}
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">الشبكة الافتراضية</label>
                {{ form.network }}
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">الحد السنوي الافتراضي (ر.س) <span class="text-red-500">*</span></label>
                {{ form.annual_limit }}
                {% if form.annual_limit.errors %}
                    <p class="text-red-500 text-xs mt-1">{{ form.annual_limit.errors.0 }}</p>
                {% endif %}
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">ترتيب العرض</label>
                {{ form.order }}
            </div>
        </div>
        <div class="mt-4 flex gap-3">
            <button type="submit" class="px-5 py-2 bg-brand-600 text-white rounded-lg hover:bg-brand-700 font-bold transition text-sm">
                إضافة الفئة
            </button>
            <button type="button" onclick="document.getElementById('class-form-container').innerHTML=''"
                class="px-5 py-2 bg-slate-100 text-slate-700 rounded-lg hover:bg-slate-200 transition text-sm">
                إلغاء
            </button>
        </div>
    </form>
</div>
